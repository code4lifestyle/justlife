<div
  class="wrapper"
  style="
    --0adfd92d: url('https://deax38zvkau9d.cloudfront.net/prod/assets/static/error-background%403x.jpg?f=webp');
  "
>
  <div class="container">
    <div class="columns has-margin-top main-column">
      <div class="column is-12-desktop is-12-touch">
        <p class="is-uppercase overline c-capitalize has-text-danger">Error</p>
        <h3 class="h3-text-item has-text-black87">Oops! You look lost!</h3>
        <p class="body2-text-item has-text-black87">
          The page you are looking for is not available
        </p>
        <!-- The original nested a <button> in the link: the link itself carries the button look. -->
        <a
          class="button is-rounded is-uppercase has-text-weight-bold is-secondary has-text-white"
          [routerLink]="home()"
        >
          Return to home
        </a>
      </div>
    </div>
  </div>
</div>
